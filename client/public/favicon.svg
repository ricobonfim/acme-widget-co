<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="qc-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02CBC9"/>
      <stop offset="1" stop-color="#1E90FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square plate with brand gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#qc-grad)"/>

  <!-- "Q" ring: thick circle, open at lower right -->
  <path
    d="M32 14
       a18 18 0 1 1 -12.7 30.7"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"/>

  <!-- Cart "tail" of the Q: a short handle stroke that doubles as the Q's tail -->
  <path
    d="M36 40 L48 52"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"/>

  <!-- Two cart wheels at the base of the tail -->
  <circle cx="40" cy="50" r="3" fill="#01203A"/>
  <circle cx="48" cy="52" r="3" fill="#01203A"/>
</svg>
